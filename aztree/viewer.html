<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aztree</title>
<style>
:root {
  --bg: #0d1016; --frame: #050608; --panel: #11151c; --line: #222835; --text: #d6dae2;
  --muted: #7c8494; --dim: #545b69; --accent: #e3a55a; --neutral: #5a6170;
  --compute: oklch(0.72 0.11 55); --storage: oklch(0.72 0.11 250); --database: oklch(0.72 0.11 355);
  --network: oklch(0.72 0.11 185); --ai: oklch(0.72 0.11 295); --analytics: oklch(0.72 0.11 95);
  --ops: oklch(0.72 0.11 145); --other: oklch(0.66 0.02 260); /* one lightness and chroma: no colour shouts */
  --up: #e5534b; --down: #3fb68b; --advisor: #4fa3e0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--frame); color: var(--text);
  font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums; overflow: hidden; }
.app { position: fixed; inset: 10px; display: grid; background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
  grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto auto minmax(0, 1fr) auto; }

header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 9px 14px;
  border-bottom: 1px solid var(--line); min-width: 0; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
.logo i { display: grid; grid-template-columns: 7px 7px; gap: 2px; }
.logo i b { width: 7px; height: 7px; border-radius: 1px; }
.crumbs { color: var(--dim); display: flex; gap: 6px; align-items: center; min-width: 0; overflow: hidden; white-space: nowrap; }
.crumbs a { color: var(--muted); cursor: pointer; text-decoration: none; }
.crumbs a:hover { color: var(--text); }
.crumbs .cur { color: var(--text); background: #1b212c; padding: 2px 7px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button { background: none; border: 0; color: var(--muted); font: inherit; padding: 4px 11px; border-radius: 4px; cursor: pointer; }
.seg button.on { background: #222938; color: var(--text); }
.seg button:hover { color: var(--text); }
label.chk { display: flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; white-space: nowrap; }
label.chk input { accent-color: var(--accent); margin: 0; }
#export { background: none; border: 1px solid var(--line); color: var(--muted); font: inherit; padding: 5px 10px;
  border-radius: 6px; cursor: pointer; white-space: nowrap; }
#export:hover { color: var(--text); border-color: #3a4356; }
#filter { background: #0a0d12; border: 1px solid var(--line); color: var(--text); font: inherit; padding: 5px 9px;
  border-radius: 6px; width: 170px; outline: none; }
#filter:focus { border-color: #3a4356; }

.sub { display: flex; align-items: center; gap: 16px; padding: 8px 14px 6px; color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; }
.sub b { color: var(--text); font-weight: 600; }
.legend { display: flex; gap: 12px; margin-left: auto; }
.legend span { display: flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; }
.legend { overflow: hidden; flex-wrap: wrap; max-height: 16px; } /* entries that don't fit drop whole, never half a word */
.legend i.todo { background: #262b35 repeating-linear-gradient(135deg, transparent 0 2px, rgb(255 255 255 / .35) 2px 3px); }

/* the zoom animation transforms #map, so the clipping has to sit on a box that doesn't move */
#mapbox { margin: 2px 8px 8px 12px; min-height: 0; overflow: hidden; }
#map { position: relative; height: 100%; transform-origin: 0 0; outline: none; }
#map:focus-visible { outline: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: -1px; }
.cell { position: absolute; overflow: hidden; border-radius: 2px; cursor: pointer; }
/* disktree's look: no outlines, gaps separate the boxes, a box is a step lighter than its group */
.leaf { background-color: color-mix(in oklab, var(--c) 32%, var(--bg)); padding: 3px 5px; }
.leaf:hover { box-shadow: inset 0 0 0 1px rgb(255 255 255 / .55); }
.leaf.tiny { padding: 0; } /* smaller than its padding, a box would render bigger than its slot and spill over */
.leaf.more { background-color: color-mix(in oklab, var(--c) 18%, var(--bg)); }
.leaf.more .n { color: var(--muted); }
/* the boxes Worth a look's to-dos are about: the map is the to-do list */
.leaf.todo { background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgb(255 255 255 / .10) 6px 8px); }
.group { background-color: color-mix(in oklab, var(--c) 13%, var(--bg)); box-shadow: inset 0 2px 0 color-mix(in oklab, var(--c) 85%, var(--bg)); }
.gh { display: flex; justify-content: space-between; gap: 6px; padding: 2px 5px 0; height: 19px; white-space: nowrap; }
.gh .n { color: var(--text); overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.gh .v { color: var(--muted); font-size: 10.5px; }
.leaf .n { color: #e3e6ec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.leaf .v { color: color-mix(in srgb, var(--c) 45%, #9aa1ad); font-size: 10.5px; white-space: nowrap; }
.cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell.dim { opacity: .18; } /* the filter fades what doesn't match, so the map keeps its shape */
.leaf.sel { z-index: 2; } /* not groups: their boxes are siblings on top, and a raised group would cover them */
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }

aside { grid-column: 2; grid-row: 2 / 4; border-left: 1px solid var(--line); background: var(--panel);
  padding: 14px 16px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
#side > section:last-child { padding-bottom: 14px; } /* the bottom padding lives here, so the sticky Advisor header sits flush */
.h { color: var(--dim); font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; display: flex; justify-content: space-between; }
.h b { color: var(--accent); font-weight: 500; letter-spacing: 0; }
.sel-name { font-size: 16px; margin-top: 8px; word-break: break-word; }
.sel-name a { color: inherit; text-decoration: none; }
.sel-name a:hover { color: #fff; text-decoration: underline; }
.sel-path { color: var(--dim); margin-top: 3px; word-break: break-word; }
.big { font-size: 34px; font-weight: 300; margin-top: 10px; letter-spacing: -.5px; }
.big small { font-size: 14px; color: var(--muted); margin-left: 2px; }
.bar { height: 4px; background: #1d2330; border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin-top: 14px; }
.stats div span { display: block; color: var(--dim); font-size: 10px; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 2px; }
.stats div { font-size: 13px; }
.stats b { font-weight: 400; }
.upc, .warn { color: var(--up); } .downc { color: var(--down); }
.spark { margin-top: 14px; }
.spark svg { display: block; width: 100%; height: 46px; }
.spark .axis { display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; margin-top: 3px; }
/* lists read like a statement: plain rows, hairline dividers, a small tag for what kind of row it is */
.hint { padding: 9px 0; cursor: pointer; }
.hint + .hint { border-top: 1px solid var(--line); }
.hint:hover .hn { color: #fff; }
.ht { display: flex; justify-content: space-between; gap: 10px; }
.hn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hv { white-space: nowrap; }
.hs { color: var(--dim); font-size: 11px; margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp: 2; line-clamp: 2; } /* two lines: the reason is the point of a hint */
.tag { color: var(--c, var(--accent)); font-size: 9.5px; letter-spacing: .7px; text-transform: uppercase; margin-right: 6px; }
/* Advisor's header waits at the bottom of the panel while the lists scroll; a click scrolls to its tips */
.advh { position: sticky; bottom: 0; margin-top: auto; border-top: 1px solid var(--line); padding: 12px 0 10px;
  background: var(--panel); cursor: pointer; z-index: 1; }
.advh b { color: var(--advisor); }
.advh + section { margin-top: -14px; }
/* on a tall screen the selection stays in view too; on a laptop it would leave the lists too little room */
@media (min-height: 900px) { #side > section:first-child { position: sticky; top: -14px; padding-top: 14px; margin-top: -14px;
  background: var(--panel); z-index: 1; } }
.note { color: var(--dim); margin-top: 9px; }
.showall { color: var(--muted); margin-top: 10px; font-size: 11px; cursor: pointer; }
.showall:hover { color: var(--text); }

footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 7px 14px; border-top: 1px solid var(--line);
  color: var(--dim); white-space: nowrap; overflow: hidden; }
footer a { color: var(--muted); text-decoration: none; }
footer a:hover { color: var(--text); }
kbd { font: 10.5px ui-monospace, Menlo, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-right: 4px; }
.badge { color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 4px; padding: 0 6px; }

#tip { position: fixed; pointer-events: none; background: #1a1f29; border: 1px solid #2c3444; border-radius: 6px; padding: 7px 9px;
  z-index: 10; display: none; max-width: 320px; box-shadow: 0 6px 24px #0008; }
#tip .t1 { color: var(--text); word-break: break-word; }
#tip .t2 { color: var(--muted); margin-top: 3px; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 60vh auto auto; overflow-y: auto; }
  aside { grid-column: 1; grid-row: 4; border-left: 0; border-top: 1px solid var(--line); }
  .advh, #side > section:first-child { position: static; } /* stacked, the page scrolls, not the panel */
  footer { grid-row: 5; }
  header { flex-wrap: wrap; } .legend { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i><b style="background:var(--compute)"></b><b style="background:var(--storage)"></b><b style="background:var(--database)"></b><b style="background:var(--network)"></b></i>aztree</div>
    <div class="crumbs" id="crumbs"></div>
    <div class="spacer"></div>
    <div class="seg" id="views"></div>
    <label class="chk"><input type="checkbox" id="change"> Color by change</label>
    <button id="export" title="Download a JSON summary to give to an AI agent (e)">Export for AI</button>
    <input id="filter" aria-label="Filter" placeholder="filter  /" autocomplete="off" spellcheck="false">
  </header>
  <div class="sub" id="sub"></div>
  <div id="mapbox"><div id="map" tabindex="0"></div></div>
  <aside id="side"></aside>
  <footer>
    <span><kbd>click</kbd>select</span><span><kbd>click</kbd>again or <kbd>enter</kbd>open</span><span><kbd>tab</kbd>next</span><span><kbd>⌫</kbd>up</span>
    <span id="viewkeys"></span><span><kbd>c</kbd>color</span><span><kbd>/</kbd>filter</span><span><kbd>e</kbd>export</span><span><kbd>esc</kbd>clear</span>
    <span class="spacer"></span><span id="meta"></span>
  </footer>
</div>
<div id="tip"></div>

<script>
const DATA = __AZTREE_DATA__;

const N = DATA.days.length, SPLIT = DATA.split, DAYS = N - SPLIT;
const VIEW_KEYS = ["service", "subscription", "region", "resource", "tag"];
const TAG = DATA.views.tag?.tag ?? "tag"; // the tag view splits the bill by one tag's values; aztree.py picked the tag
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hashView = (() => { try { return decodeURIComponent(location.hash.slice(1)); } catch { return ""; } })();
const state = { view: VIEW_KEYS.includes(hashView) && DATA.views[hashView] ? hashView : "service",
  change: false, filter: "", collapsed: false, more: 0, zoom: null, sel: null, expanded: { hints: false, recs: false } };

// ---------- formatting
const SYMBOLS = { USD: "$", EUR: "€", GBP: "£", JPY: "¥", CNY: "¥", INR: "₹", KRW: "₩", BRL: "R$", AUD: "A$", CAD: "C$",
  NZD: "NZ$", HKD: "HK$", TWD: "NT$", MXN: "MX$", ILS: "₪", TRY: "₺", PLN: "zł ", ZAR: "R " };
const sym = code => esc(SYMBOLS[code || "USD"] ?? `${code} `);
const CUR = DATA.mixed_currencies ? "" : sym(DATA.currency); // unconverted currencies: no one symbol would be true
const MIXED = DATA.mixed_currencies ? `<span class="warn" title="Azure couldn't convert these subscriptions to one currency, so every amount adds different currencies">totals mix ${esc(DATA.mixed_currencies.join(" and "))}: Azure didn't convert them</span>` : "";
function money(v, s = CUR) {
  const a = Math.abs(v), p = (v < 0 ? "-" : "") + s;
  if (a >= 1e6) return p + (a / 1e6).toFixed(2) + "M";
  if (a >= 1e4) return p + (a / 1e3).toFixed(1) + "k";
  if (a >= 100) return p + Math.round(a).toLocaleString("en-US");
  return p + a.toFixed(2);
}
function bigMoney(v) {
  const [w, c] = Math.abs(v).toFixed(2).split(".");
  return `${v < 0 ? "-" : ""}${CUR}${Number(w).toLocaleString("en-US")}<small>.${c}</small>`;
}
const pct = v => (Math.abs(v) >= 0.1 || v === 0 ? Math.round(v * 100) : (v * 100).toFixed(1)) + "%";
const day = s => new Date(s + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
const period = () => `${day(DATA.days[SPLIT])} – ${day(DATA.days[N - 1])}`;

// ---------- names and categories
const SHORT = {
  "Azure Front Door Service": "Front Door", "Azure Data Factory v2": "Data Factory", "Azure Grafana Service": "Managed Grafana",
  "Azure Kubernetes Service": "AKS", "Microsoft Defender for Cloud": "Defender for Cloud", "Azure Cognitive Search": "AI Search",
};
const shortSvc = s => SHORT[s] || s.replace(/^(Azure|Microsoft)\s+/, "");
const lastSeg = id => id.split("/").filter(Boolean).pop() || id;
const DIM = {
  ServiceName: { one: "service", many: "services", label: v => shortSvc(v) },
  Meter: { one: "meter", many: "meters", label: v => v },
  SubscriptionId: { one: "subscription", many: "subscriptions", label: (v, names) => names[v] || v },
  ResourceLocation: { one: "region", many: "regions", label: v => v || "(no region)" },
  ResourceGroupName: { one: "resource group", many: "resource groups", label: (v, names) => names[v] || lastSeg(v) },
  // resources without an id (some marketplace and support charges) keep a plain label
  ResourceId: { one: "resource", many: "resources", label: v => (v.startsWith("/") ? lastSeg(v) : shortSvc(v)) },
  // one box per value of the tag, and one for spend on resources without it
  TagValue: { one: `${TAG} value`, many: `${TAG} values`, label: v => v || "(untagged)" },
};
const CATS = [
  ["compute", "Compute"], ["storage", "Storage"], ["database", "Database"], ["network", "Network"],
  ["ai", "AI / ML"], ["analytics", "Analytics"], ["ops", "Ops & security"], ["other", "Other"],
];
const SVC_RULES = [
  ["ai", /Foundry|Cognitive Services|OpenAI|Machine Learning|AI Search|Cognitive Search|Bot Service|Speech|Translator|Document Intelligence|Form Recognizer|Azure AI/i],
  ["database", /SQL|Cosmos DB|Redis|MySQL|PostgreSQL|MariaDB|Database|Cache/i],
  ["ops", /Monitor|Log Analytics|Defender|Security Center|Sentinel|Key Vault|Application Insights|Automation|Grafana|Azure Arc|App Configuration|Policy|Entra|Active Directory/i],
  ["analytics", /Synapse|Data Factory|Databricks|Event Hubs|Stream Analytics|Data Explorer|HDInsight|Power BI|Fabric|Analysis Services|Purview/i],
  ["storage", /Storage|Backup|Site Recovery|NetApp|Container Registry|Data Box|Archive/i],
  ["network", /Bandwidth|Virtual Network|Front Door|CDN|Content Delivery|Load Balancer|Application Gateway|VPN Gateway|ExpressRoute|NAT Gateway|DNS|Traffic Manager|Firewall|Private Link|Network Watcher|DDoS|Bastion|API Management|Virtual WAN/i],
  ["compute", /Virtual Machines|App Service|Functions|Kubernetes|Container Instances|Container Apps|Batch|Cloud Services|Service Fabric|Logic Apps|Spring|Virtual Desktop|Static Web Apps/i],
];
const METER_RULES = [
  ["storage", /Data Stored|\bDisks?\b|Snapshot|\b(LRS|GRS|ZRS|RA-GRS)\b|Backup/i],
  ["network", /Data Transfer|Bandwidth|Public IP|Private Endpoint/i],
];
// resource ids name their provider: /subscriptions/../providers/microsoft.web/sites/shop
const PROVIDER_RULES = [
  ["storage", /\/providers\/microsoft\.(compute\/(disks|snapshots)|storage\/|containerregistry|recoveryservices|netapp|dataprotection)/],
  ["ai", /\/providers\/microsoft\.(cognitiveservices|machinelearningservices|search\/|botservice)/],
  ["database", /\/providers\/microsoft\.(sql|documentdb|cache|dbfor)/],
  ["ops", /\/providers\/microsoft\.(operationalinsights|insights|keyvault|security|dashboard|appconfiguration|automation|operationsmanagement|alertsmanagement)/],
  ["analytics", /\/providers\/microsoft\.(eventhub|datafactory|synapse|databricks|kusto|streamanalytics|hdinsight|purview|fabric)/],
  ["network", /\/providers\/microsoft\.(network|cdn)\//],
  ["compute", /\/providers\/microsoft\.(compute|web|containerservice|app\/|containerinstance|logic|batch|servicefabric)/],
];
const match = (rules, s) => (rules.find(([, re]) => re.test(s)) || [])[0];
const svcCat = s => match(SVC_RULES, s) || "other";

function category(n) {
  if (n.more) return null; // a mix of whatever was too small to draw
  const [A, B] = DATA.views[state.view].dims;
  const dim = n.kind === "leaf" ? B : A;
  if (dim === "Meter") return match(METER_RULES, n.key) || svcCat(n.parent.key);
  if (dim === "ServiceName") return svcCat(n.key);
  if (dim === "ResourceId") return n.key.startsWith("/") ? match(PROVIDER_RULES, n.key) || "other" : svcCat(n.key);
  return null;
}
function color(n) {
  if (state.change) {
    if (n.prev < 0.01) return n.cur >= 0.5 ? "var(--up)" : "var(--neutral)";
    const p = (n.cur - n.prev) / n.prev;
    if (Math.abs(p) < 0.05) return "var(--neutral)";
    const t = Math.min(Math.abs(p) / 0.6, 1);
    return `color-mix(in srgb, var(${p > 0 ? "--up" : "--down"}) ${Math.round(35 + 65 * t)}%, var(--neutral))`;
  }
  const c = category(n);
  return c ? `var(--${c})` : "var(--neutral)";
}

// ---------- tree
// With collapse off, rows that don't match the filter stay in the tree (the map dims them): `hit` marks the matches.
function buildTree(viewKey, filter, collapse = true) {
  const v = DATA.views[viewKey], names = v.names || {};
  const [A, B] = v.dims, q = filter.toLowerCase();
  const root = { kind: "root", name: "all", children: [], daily: new Float64Array(N) };
  const groups = new Map();
  for (const r of v.rows) {
    const [a, b] = r.k;
    const ga = DIM[A].label(a, names), lb = DIM[B].label(b, names);
    const hit = !q || `${a} ${b} ${ga} ${lb}`.toLowerCase().includes(q);
    if (!hit && collapse) continue;
    let g = groups.get(a);
    if (!g) {
      g = { kind: "group", key: a, name: ga, full: a, dim: A, parent: root, children: [], daily: new Float64Array(N) };
      groups.set(a, g); root.children.push(g);
    }
    g.children.push({ kind: "leaf", key: b, name: lb, full: b, dim: B, parent: g, daily: Float64Array.from(r.d), hit });
  }
  (function total(n) {
    if (n.children) {
      for (const c of n.children) { total(c); for (let i = 0; i < N; i++) n.daily[i] += c.daily[i]; }
      // credits and refunds can't be drawn as boxes, but they are in the totals: keep count of them
      n.credits = n.children.reduce((s, c) => s + c.credits, 0);
      // a box's area is what its boxes spent, so a refund bigger than a service's usage can't hide the service's meters
      const size = c => c.size ?? c.cur;
      n.gone = n.children.filter(c => size(c) < 0.005 && c.prev >= 0.005); // spent before, nothing now: no box, still news
      n.children = n.children.filter(c => size(c) >= 0.005).sort((a, b) => size(b) - size(a));
      n.hit = n.children.some(c => c.hit);
      n.size = n.children.reduce((s, c) => s + size(c), 0);
    }
    n.prev = 0; n.cur = 0;
    for (let i = 0; i < N; i++) i < SPLIT ? (n.prev += n.daily[i]) : (n.cur += n.daily[i]);
    if (!n.children) n.credits = Math.min(n.cur, 0);
  })(root);
  return root;
}
let root = buildTree(state.view, "");
const whole = buildTree("service", ""), grand = whole.cur; // shares are always of the whole bill, even when filtered
const CREDITS = whole.credits; // meters with a negative total: the export's credits_and_refunds
// spend on resources without the tag, for the tag view's header (the "(untagged)" box before any filter)
const UNTAGGED = (DATA.views.tag?.rows || []).filter(r => r.k[0] === "")
  .reduce((s, r) => s + r.d.slice(SPLIT).reduce((a, b) => a + b, 0), 0);
// how to shrink the untagged box: the export adds it when untagged spend is a tenth of the bill or more
const FIX = (DATA.export?.by_tag || []).find(r => r.untagged)?.how_to_fix;

// ---------- squarified treemap layout
function squarify(nodes, x, y, w, h) {
  const sz = n => n.size ?? n.cur, out = [], total = nodes.reduce((s, n) => s + sz(n), 0);
  if (total <= 0 || w < 1 || h < 1) return out;
  let items = nodes.map(n => ({ n, a: (sz(n) / total) * w * h }));
  const worst = (row, side) => {
    let s = 0, mx = 0, mn = Infinity;
    for (const r of row) { s += r.a; mx = Math.max(mx, r.a); mn = Math.min(mn, r.a); }
    return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn));
  };
  while (items.length) {
    const side = Math.min(w, h);
    let row = [items[0]], best = worst(row, side), i = 1;
    for (; i < items.length; i++) {
      const next = worst([...row, items[i]], side);
      if (next > best) break;
      row.push(items[i]); best = next;
    }
    items = items.slice(i);
    const area = row.reduce((s, r) => s + r.a, 0);
    if (w >= h) {
      const cw = items.length ? area / h : w; let cy = y;
      for (const r of row) { const rh = r.a / cw; out.push({ n: r.n, x, y: cy, w: cw, h: rh }); cy += rh; }
      x += cw; w -= cw;
    } else {
      const rh = items.length ? area / w : h; let cx = x;
      for (const r of row) { const rw = r.a / rh; out.push({ n: r.n, x: cx, y, w: rw, h: rh }); cx += rw; }
      y += rh; h -= rh;
    }
  }
  return out;
}

// ---------- rendering
const map = $("#map");
function place(el, r, gap) {
  el.style.left = r.x + gap + "px"; el.style.top = r.y + gap + "px";
  el.style.width = Math.max(0, r.w - gap * 2) + "px"; el.style.height = Math.max(0, r.h - gap * 2) + "px";
}
let moreCount = 0; // boxes at the opened "+N more" level, for the crumbs
let drawn = []; // the nodes the last render() drew, in drawing order (largest first within each parent)
function cell(cls, n, r, gap) {
  const el = document.createElement("div");
  el.className = "cell " + cls + (isTodo(n) ? " todo" : "") + (state.filter && !state.collapsed && !n.hit ? " dim" : "");
  el._n = n; n._el = el;
  drawn.push(n);
  el.style.setProperty("--c", color(n));
  place(el, r, gap);
  return el;
}
// the long tail: boxes too small to read or click become one "+N more" box (double-click opens the group)
const MIN_BOX = 16 * 16; // px²
function fold(nodes, w, h) {
  const total = nodes.reduce((s, n) => s + n.cur, 0), px = total > 0 ? (w * h) / total : 0;
  const i = nodes.findIndex(n => n.cur * px < MIN_BOX);
  if (i < 0 || nodes.length - i < 2) return nodes;
  const rest = nodes.slice(i), dim = rest[0].dim;
  const more = { kind: "leaf", more: rest.length, rest, key: "\u0000more", name: `+${rest.length} more`, dim, parent: rest[0].parent,
    hit: rest.some(n => n.hit), // lit when the filter matches something inside it
    full: `${rest.length} smaller ${DIM[dim].many}`, cur: 0, prev: 0, daily: new Float64Array(N) };
  for (const n of rest) {
    more.cur += n.cur; more.prev += n.prev;
    for (let d = 0; d < N; d++) more.daily[d] += n.daily[d];
  }
  return [...nodes.slice(0, i), more].sort((a, b) => b.cur - a.cur);
}
function drawLeaf(frag, r) {
  const tiny = r.w < 14 || r.h < 10;
  const el = cell("leaf" + (tiny ? " tiny" : "") + (r.n.more ? " more" : ""), r.n, r, 1);
  if (r.w > 42 && r.h > 17) el.innerHTML = `<div class="n">${esc(r.n.name)}</div>` + (r.h > 32 ? `<div class="v">${money(r.n.cur)}</div>` : "");
  frag.append(el);
}
function drawGroup(frag, r) {
  const el = cell("group", r.n, r, 1.5);
  frag.append(el);
  if (r.w > 46 && r.h > 40) {
    el.innerHTML = `<div class="gh"><span class="n">${esc(r.n.name)}</span><span class="v">${money(r.n.cur)}</span></div>`;
    for (const c of squarify(fold(r.n.children, r.w - 8, r.h - 25), r.x + 4, r.y + 21, r.w - 8, r.h - 25)) drawLeaf(frag, c);
  } else if (r.w > 30 && r.h > 16) {
    el.innerHTML = `<div class="gh"><span class="n">${esc(r.n.name)}</span></div>`;
  }
}
// zoom holds a group key or null; "" is a real key (the no-region group), so never test it for truthiness
function zoomed() { return state.zoom === null ? undefined : root.children.find(g => g.key === state.zoom); }
const narrowed = () => !!state.filter && state.collapsed; // Enter in the filter: only the matches are in the tree
// a node as keys that survive a rebuild: [group, leaf], or [group, null] for a group; never "+N more"
const selKey = n => (!n || n.more || !n.parent ? null : n.kind === "group" ? [n.key, null] : [n.parent.key, n.key]);
function findNode(k) {
  if (!k) return null;
  const g = root.children.find(g => g.key === k[0]);
  return (k[1] === null ? g : g?.children.find(c => c.key === k[1])) ?? null;
}
function rebuild() {
  const k = selKey(state.sel);
  root = buildTree(state.view, state.filter, narrowed());
  if (state.zoom !== null && !zoomed()) state.zoom = null;
  state.sel = findNode(k);
}

function render() {
  drawn = [];
  const base = zoomed() || root;
  const W = map.clientWidth, H = map.clientHeight, frag = document.createDocumentFragment();
  if (!base.children.length) {
    map.innerHTML = `<div class="empty">${narrowed() ? "Nothing matches “" + esc(state.filter) + "”" : "No spend in this period"}</div>`;
  } else {
    if (base === root) for (const r of squarify(base.children, 0, 0, W, H)) drawGroup(frag, r);
    else {
      let nodes = base.children; // "+N more" opened: its boxes, one level of the long tail at a time
      for (let i = 0; i < state.more; i++) { const m = fold(nodes, W, H).find(n => n.more); if (!m) break; nodes = m.rest; }
      moreCount = state.more ? nodes.length : 0;
      for (const r of squarify(fold(nodes, W, H), 0, 0, W, H)) drawLeaf(frag, r);
    }
    map.replaceChildren(frag);
  }
  if (state.sel?._el?.isConnected) state.sel._el.classList.add("sel");
  renderChrome(base);
  renderSide();
}

// a total that includes credits or refunds is bigger in boxes than in the header; say by how much
// Only the service view has meters, where a negative one is a credit or refund. The other views net those into their
// boxes, so there only the whole bill carries the note, with the same figure as the service view and the export.
const creditNote = (n, tag) => {
  const c = state.view === "service" ? n.credits : n.kind === "root" && !narrowed() ? CREDITS : 0;
  return c <= -0.005
    ? `<${tag} class="credits" title="meters with a negative total (credits, refunds) count in the total but can't be drawn as boxes">incl. ${money(c)} credits &amp; refunds</${tag}>`
    : "";
};

function renderChrome(base) {
  const v = DATA.views[state.view], [A, B] = v.dims;
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === state.view));
  $("#change").checked = state.change;
  $("#crumbs").innerHTML = `<span>/</span>` + (base === root
    ? `<span class="cur">all ${esc(DIM[A].many)}</span>`
    : state.more ? `<a data-up>all ${esc(DIM[A].many)}</a><span>/</span><a data-group>${esc(base.name)}</a><span>/</span><span class="cur">${moreCount} smaller ${esc(DIM[B].many)}</span>`
    : `<a data-up>all ${esc(DIM[A].many)}</a><span>/</span><span class="cur">${esc(base.name)}</span>`);
  const leaves = root.children.reduce((s, g) => s + g.children.length, 0);
  const todoKey = marks().size ? '<span><i class="todo"></i>to-do</span>' : ""; // first, so a narrow legend clips "Other" instead
  const legend = todoKey + (state.change

  // what the filter matches, counted over the whole view whether the map dims the rest or drops it
  const hits = state.filter ? root.children.flatMap(g => g.children).filter(n => n.hit) : [];
  const found = hits.reduce((s, n) => s + n.cur, 0);
  const readout = !state.filter ? "" : `<span>filter “${esc(state.filter)}” · ${hits.length
    ? `${hits.length} ${esc(hits.length === 1 ? DIM[B].one : DIM[B].many)} · ${money(found)} · ${pct(grand > 0 ? found / grand : 0)} of bill`
    : "no match"}</span>`;

  const purchases = DATA.commitment_purchases >= 0.01
    ? `<span title="--metric AmortizedCost spreads them over their term">reservation and savings plan purchases ${money(DATA.commitment_purchases)}, booked the day they were bought</span>` : "";
  $("#sub").innerHTML = `<span><b>${money(root.cur)}</b> · ${period()}</span><span>${root.children.length} ${esc(DIM[A].many)} · ${leaves} ${esc(DIM[B].many)}</span>
    ${MIXED}${purchases}${fallback}${untagged}${creditNote(root, "span")}${readout}<div class="legend">${legend}</div>`;
}

// a subscription with too many resources gets one total per resource and period, so no daily chart in that view
// only those subscriptions' boxes lose the chart; the whole view (and old data without names to match) says it for all
const FALLBACK = new Set((DATA.subscriptions || []).filter(s => (DATA.resource_fallback || []).includes(s.name)).map(s => s.id.toLowerCase()));
const subOf = n => ((n.kind === "leaf" ? n.parent.key : n.key).match(/^\/subscriptions\/([^/]+)/i) || [])[1]?.toLowerCase();
const totalsOnly = n => state.view === "resource" && DATA.resource_fallback?.length > 0
  && (!n || n.kind === "root" || !FALLBACK.size || FALLBACK.has(subOf(n)));

function spark(n) {
  if (totalsOnly(n)) return `<div class="note">No daily chart here: this view has period totals only (too many resources for daily detail).</div>`;
  const max = Math.max(...n.daily, 0.0001), bw = 100 / N;
  const bars = Array.from(n.daily, (v, i) => {
    const h = Math.max(0, (v / max) * 44);
    return `<rect x="${(i * bw).toFixed(2)}" y="${(46 - h).toFixed(2)}" width="${(bw * 0.7).toFixed(2)}" height="${h.toFixed(2)}" fill="${i < SPLIT ? "#3a4252" : "var(--accent)"}"/>`;
  }).join("");

    <div class="axis"><span>${day(DATA.days[0])}</span><span>previous ${DAYS}d | last ${DAYS}d</span><span>${day(DATA.days[N - 1])}</span></div></div>`;
}

// resources and resource groups are keyed by ARM id, subscriptions by bare GUID; the demo's ids are made up
const armId = n => n.kind === "root" || n.more || DATA.demo ? null
  : n.dim === "SubscriptionId" && /^[0-9a-f-]{36}$/i.test(n.key) ? `/subscriptions/${n.key}`
  : /^\/subscriptions\/[^/]+/i.test(n.key) ? n.key : null;

const TENANTS = Object.fromEntries((DATA.subscriptions || []).filter(s => s.tenant).map(s => [String(s.id).toLowerCase(), s.tenant]));
const portalLink = (n, html) => {
  const id = armId(n), tenant = id && TENANTS[(id.match(/^\/subscriptions\/([^/]+)/i) || [])[1]?.toLowerCase()];
  const at = tenant ? `@${esc(encodeURIComponent(tenant))}/` : "";

function renderSide() {

    <div class="bar"><i style="width:${Math.min(100, share * 100)}%"></i></div>

    ? "Resource Graph checks need Reader, and didn't run where it's missing." : `Resource Graph checks didn't run everywhere (${esc(gerr)}).`}</div>`;
  if (hints.length || graphNote) {
    const shown = state.expanded.hints ? hints : hints.slice(0, SHOWN_HINTS);
    // a count, not a sum: a dev/test group's total can include meters that are hints of their own
    html += `<section><div class="h">Worth a look${hints.length ? ` <b>${hints.length}</b>` : ""}</div>` +
      shown.map((h, i) => row(`data-hint="${i}"`, h.c, h.title, h.n.full, money(h.value), HINT_TAG[h.h.kind] || "look", esc(h.why), h.why)).join("") +

      drops.map((h, i) => {
        const gone = h.n.cur < 0.005, why = `${gone ? "" : "down " + pct(-h.d / h.n.prev) + " "}(${money(h.d)}) vs previous ${DAYS}d`;
        return row(`data-drop="${i}"`, "var(--down)", `${shortSvc(h.n.parent.key)} · ${h.n.name}`, h.n.full, money(h.n.cur), gone ? "gone" : "fell", why);
      }).join("") + `</section>`;

  $("#side").innerHTML = html + advisorPanel();
}

// ---------- Azure Advisor: cost recommendations, read by aztree.py (none when run with --no-advisor)
const TERM = { P1Y: "1-yr term", P3Y: "3-yr term", P5Y: "5-yr term" };
const SHOWN_RECS = 5, SHOWN_HINTS = 6;
const HINT_TAG = { grower: "grew", spike: "spike", pit: "fix", devtest: "dev/test", steady: "reserve", idle: "idle" };
// one row of a side-panel list: title and amount on a line, then a small kind tag and the (already escaped) reason
const row = (attr, color, title, full, value, tag, whyHtml, whyTitle) => `<div class="hint" ${attr} role="button" tabindex="0" style="--c:${color}">
  <div class="ht"><span class="hn" title="${esc(full)}">${esc(title)}</span><span class="hv">${value}</span></div>
  <div class="hs"${whyTitle ? ` title="${esc(whyTitle)}"` : ""}>${tag ? `<span class="tag">${tag}</span>` : ""}${whyHtml}</div></div>`;
// a long list opens in place: "show all N" / "show fewer"
const showAll = (list, n, cap) => (n > cap
  ? `<div class="showall" data-more="${list}" role="button" tabindex="0">${state.expanded[list] ? "show fewer" : `show all ${n}`}</div>` : "");
// the export's copy of Advisor's tips knows which meters a reservation or savings plan would cover
const TIPS = DATA.export?.advisor ?? DATA.advisor;
// "covers SQL Database · vCore ($1,216/mo) + 1 more", or who/what the tip is about
const tipLine = r => (r.covers?.length
  ? `covers ${shortSvc(r.covers[0].service)} · ${r.covers[0].meter} (${money(r.covers_monthly)}/mo)${r.covers.length > 1 ? ` + ${r.covers.length - 1} more` : ""}`
  : [r.resource_name, r.sku, r.region, Object.hasOwn(TERM, r.term) && TERM[r.term]].filter(Boolean).join(" · "));
function advisorPanel() {
  const recs = TIPS;
  if (!recs) return "";
  if (!recs.length) {
    const err = DATA.advisor_error;
    const why = !err ? "Advisor has no cost recommendations."
      : /^HTTP 40[13]\b/.test(err) ? "Advisor wasn't readable with this login (needs Reader)."
      : `Advisor couldn't be read (${esc(err)}).`;
    return `<div class="advh h">Advisor</div><section><div class="note">${why}</div></section>`;
  }
  const top = state.expanded.recs ? recs : recs.slice(0, SHOWN_RECS);
  // the header is the aside's own child, so it can stick to the bottom while the lists above it scroll
  return `<div class="advh h" data-adv role="button" tabindex="0">Advisor <b>${recs.length} cost tip${recs.length > 1 ? "s" : ""}</b></div><section>` +
    top.map((r, i) => row(`data-rec="${i}"`, "var(--advisor)", r.problem, r.solution || r.problem,
      r.annual_savings ? money(r.annual_savings, sym(r.currency || DATA.currency)) + "/yr" : "–", null, esc(tipLine(r)),
      [r.resource_name, r.sku, r.region, Object.hasOwn(TERM, r.term) && TERM[r.term]].filter(Boolean).join(" · "))).join("") +
    showAll("recs", recs.length, SHOWN_RECS) + `</section>`;
}

// ---------- biggest drops: what fell since the previous period, including what went to zero (always the service view)
let _drops;
function biggestDrops() {
  if (_drops) return _drops;
  const t = buildTree("service", "");
  const leaves = [...t.children, ...t.gone].flatMap(g => [...g.children, ...(g.gone || [])]);
  return (_drops = leaves.map(n => ({ n, d: n.cur - n.prev }))
    .filter(h => h.n.cur > -0.005 && h.d <= -Math.max(1, t.cur * 0.005) && h.d / h.n.prev < -0.2) // refunds go in the credits note
    .sort((a, b) => a.d - b.d).slice(0, 3));
}

// ---------- worth a look: the hints aztree.py computed (the export's `hints`, in order), placed on the service view
const HINT_COLOR = { grower: "var(--up)", spike: "var(--up)", pit: "var(--accent)", devtest: "var(--accent)", steady: "var(--advisor)",
  idle: "var(--accent)" };
let _hints;
function worthALook() {
  if (_hints) return _hints;
  const t = buildTree("service", ""), leaves = new Map();
  for (const g of [...t.children, ...t.gone]) for (const n of [...g.children, ...(g.gone || [])]) leaves.set(`${g.key}\u0000${n.key}`, n);
  const groups = new Map(DATA.views.resource ? buildTree("resource", "").children.map(g => [g.key, g]) : []);
  // each hint becomes a row: what it's about, its dollars, and where a click takes you
  const place = h => {
    const c = HINT_COLOR[h.kind] || "var(--accent)", why = hintText(h);
    if (h.kind === "devtest") {
      const n = groups.get(h.group);
      return n && { h, n, c, why, title: n.name, value: h.amount, view: "resource", find: m => m.kind === "group" && m.key === h.group };
    }
    if (h.kind === "idle") { // several resources: a click opens the biggest, which the reason names
      const top = h.resources[0], n = groups.get(top.group)?.children.find(c => c.key === top.id);
      return n && { h, n, c, why, title: h.label, value: h.amount, view: "resource", find: m => m.kind === "leaf" && m.key === top.id };
    }
    if (h.kind === "steady") {
      const n = t.children.find(g => g.key === h.service);
      return n && { h, n, c, why, title: n.name, value: h.current, view: "service", find: m => m.kind === "group" && m.key === h.service };
    }
    const n = leaves.get(`${h.service}\u0000${h.meter}`);
    return n && { h, n, c, why, title: `${shortSvc(n.parent.key)} · ${n.name}`, value: n.cur, view: "service",
      find: m => m.kind === "leaf" && m.key === n.key && m.parent.key === n.parent.key };
  };
  return (_hints = (DATA.export?.hints || []).map(place).filter(Boolean)); // the panel shows the first few; "show all" opens the rest
}
function hintText(h) {
  if (h.kind === "devtest") return `${h.resources} always-on ${h.resources === 1 ? "resource" : "resources"} in this dev/test group billed every day of the period; scale down or stop outside working hours, or go serverless`;
  if (h.kind === "grower") return h.previous < 0.01 ? "new this period" : `up ${pct(h.change / h.previous)} (+${money(h.change)}) vs previous ${DAYS}d`;
  if (h.kind === "spike") return `spiked on ${day(h.date)}: ${money(h.day_cost)} vs a usual ${money(h.usual)}/day`;
  if (h.kind === "steady") return `steady at about ${money(h.monthly)}/mo on ${h.meters.join(", ")}: a reservation or savings plan could cut it`;
  return h.reason || "";
}

// the boxes the to-dos in Worth a look are about, in the view each row jumps to: hatched on the map
const _marks = {};
function marks() {
  if (_marks[state.view]) return _marks[state.view];
  const m = new Set();
  for (const x of worthALook()) {
    const h = x.h;
    if (x.view !== state.view) continue;
    if (h.kind === "pit") m.add(h.service + "\u0000" + h.meter);
    else if (h.kind === "steady") for (const meter of h.meters) m.add(h.service + "\u0000" + meter);
    else if (h.kind === "idle") for (const r of h.resources) m.add(r.group + "\u0000" + r.id);
    else if (h.kind === "devtest") m.add(h.group + "\u0000*");
  }
  return (_marks[state.view] = m);
}
const isTodo = n => n.kind === "leaf" && !n.more && (marks().has(n.parent.key + "\u0000" + n.key) || marks().has(n.parent.key + "\u0000*"));

// ---------- interaction
function showView(v) {
  state.view = v; state.zoom = null; state.sel = null; state.more = 0;
  root = buildTree(v, state.filter, narrowed());
}
// Back and Forward: a view change, a zoom and a jump are steps; selecting only updates the step you're on
function remember(push) {
  const s = { view: state.view, zoom: state.zoom, more: state.more, sel: findNode(selKey(state.sel)) === state.sel ? selKey(state.sel) : null };
  history[push ? "pushState" : "replaceState"](s, "", "#" + state.view);
}
function setView(v) {
  if (!DATA.views[v] || v === state.view) return;
  showView(v); render(); remember(true);
}
function select(n) {
  if (state.sel?._el) state.sel._el.classList.remove("sel");
  state.sel = n;
  if (n?._el?.isConnected) n._el.classList.add("sel");
  renderSide(); remember(false);
}
// open and up grow the group into the map, or shrink it back, like disktree; the whole map moves because render()
// rebuilt every box. Transforms don't resize the map, so the ResizeObserver stays quiet.
let anim;
const rectOf = n => n?._el && { x: parseFloat(n._el.style.left), y: parseFloat(n._el.style.top),
  w: parseFloat(n._el.style.width), h: parseFloat(n._el.style.height) };
function animateZoom(r, opening) {
  const W = map.clientWidth, H = map.clientHeight;
  if (!r || !(r.w >= 1 && r.h >= 1) || !map.animate || globalThis.matchMedia?.("(prefers-reduced-motion: reduce)").matches) return;
  const sx = r.w / W, sy = r.h / H;
  const small = `translate(${r.x}px, ${r.y}px) scale(${sx}, ${sy})`, big = `translate(${-r.x / sx}px, ${-r.y / sy}px) scale(${1 / sx}, ${1 / sy})`;
  anim?.cancel();
  anim = map.animate([{ transform: opening ? small : big }, { transform: "none" }],
    { duration: Math.min(310, 130 + 45 * Math.log2(1 / (sx * sy))), easing: "cubic-bezier(.33, 1, .68, 1)" });
}
function open(n) {
  if (n?.more && state.zoom !== null) { state.more++; state.sel = null; render(); remember(true); return; } // one level into the long tail
  const g = n?.kind === "leaf" ? n.parent : n;
  // already inside, or a group that isn't on this map (a drop whose service went to zero): nothing to open
  if (g?.kind !== "group" || state.zoom === g.key || !root.children.includes(g)) return;
  const from = rectOf(g);
  state.zoom = g.key; state.more = 0; render(); remember(true); animateZoom(from, true);
}
// Tab walks the drawn boxes by size among the selection's siblings (disktree: scanning for space is this walk)
function step(dir) {
  let peers = drawn.filter(n => n.parent === state.sel?.parent);
  // the selection isn't drawn (the group just opened, or a drop that went to zero): walk what the map shows
  if (!peers.length) peers = drawn.filter(n => n.parent === (zoomed() || root));
  if (!peers.length) return false;
  const i = peers.indexOf(state.sel), j = i < 0 ? 0 : i + dir;
  if (j < 0 || j >= peers.length) return false; // past the end: the caller lets Tab move on
  select(peers[j]); return true;
}
function up(animate = true) {
  if (state.more > 0) { state.more--; state.sel = null; render(); remember(true); return; }
  if (state.zoom !== null) {
    const g = zoomed(); state.zoom = null; state.more = 0; state.sel = g || null; render(); remember(true);
    if (animate) animateZoom(rectOf(g), false); // g's box in the top-level map, just drawn
  }
  else if (state.sel) select(null);
}
function clearFilter() { state.filter = ""; state.collapsed = false; $("#filter").value = ""; }
// jump to a box in a view: zoom into its group and select it
function reveal(view, find) {
  clearFilter(); showView(view);
  for (const g of root.children) {
    if (find(g)) { state.sel = g; break; }
    const leaf = g.children.find(find);
    if (leaf) { state.zoom = g.key; state.sel = leaf; break; }
  }
  render(); remember(true);
}
addEventListener("popstate", e => {
  const s = e.state;
  if (!s || !Object.hasOwn(DATA.views, s.view)) return;
  clearFilter();
  showView(s.view); // not setView: Back to the same view with another zoom must still land
  const z = s.zoom ?? null; // "" is a real zoom key (no region, untagged)
  if (z !== null && root.children.some(g => g.key === z)) { state.zoom = z; state.more = s.more ?? 0; }
  state.sel = findNode(s.sel);
  render();
});

// one button per view the data has; the tag view's is named after its tag
const VIEW_NAMES = { service: "Service", subscription: "Subscription", region: "Region", resource: "Resource" };
$("#views").innerHTML = VIEW_KEYS.filter(v => DATA.views[v])
  .map(v => `<button data-v="${v}">${esc(VIEW_NAMES[v] || TAG)}</button>`).join("");
$("#viewkeys").innerHTML = VIEW_KEYS.map((v, i) => (DATA.views[v] ? `<kbd>${i + 1}</kbd>` : "")).join("") + "view";

// click selects; clicking the selected box again opens it (a double click is two clicks)
map.addEventListener("click", e => { const c = e.target.closest(".cell"), n = c ? c._n : null; n && n === state.sel ? open(n) : select(n); });
$("#views").addEventListener("click", e => e.target.dataset.v && setView(e.target.dataset.v));
$("#change").addEventListener("change", e => { state.change = e.target.checked; render(); });
$("#crumbs").addEventListener("click", e => { // a crumb jump doesn't animate
  if (e.target.closest("[data-group]")) { state.more = 0; state.sel = null; render(); remember(true); }
  else if (e.target.closest("[data-up]")) { state.more = 0; up(false); }
});
// typing dims what doesn't match; the map keeps its shape, and the zoom and selection stay
$("#filter").addEventListener("input", e => { state.filter = e.target.value.trim(); state.collapsed = false; rebuild(); render(); });
$("#side").addEventListener("click", e => {
  if (e.target.closest("[data-adv]")) { $("#side").scrollTop = $("#side").scrollHeight; return; }
  const more = e.target.closest("[data-more]");
  if (more) { state.expanded[more.dataset.more] = !state.expanded[more.dataset.more]; renderSide(); return; }
  const h = e.target.closest("[data-hint]"), dr = e.target.closest("[data-drop]"), r = e.target.closest("[data-rec]");
  const same = leaf => n => n.kind === "leaf" && n.key === leaf.key && n.parent.key === leaf.parent.key;
  if (h) {
    const x = worthALook()[+h.dataset.hint];
    reveal(x.view, x.find);
  } else if (dr) {
    const leaf = biggestDrops()[+dr.dataset.drop].n;
    reveal("service", same(leaf));
    if (!state.sel) { // went to zero: no box to select, so open its service (if it still has one) and show its numbers
      if (root.children.some(g => g.key === leaf.parent.key)) state.zoom = leaf.parent.key;
      state.sel = leaf; render(); remember(false); // the step Back returns to is the service, not the top
    }
  } else if (r) {
    const rec = TIPS[+r.dataset.rec], sub = (rec.resource.match(/^\/subscriptions\/([^/]+)$/) || [])[1], top = rec.covers?.[0];
    if (top) reveal("service", n => n.kind === "leaf" && n.key === top.meter && n.parent.key === top.service); // the biggest meter it covers
    else if (/\/resourcegroups\//.test(rec.resource)) reveal("resource", n => n.key === rec.resource);
    else if (sub) reveal("subscription", n => n.kind === "group" && n.key.toLowerCase() === sub);  // reservations, savings plans
  }
});
document.addEventListener("keydown", e => {
  const typing = e.target === $("#filter");
  if (e.key === "Escape") { // one thing at a time: the filter, then the selection, then up a level
    if (typing || state.filter) { clearFilter(); $("#filter").blur(); rebuild(); render(); }
    else if (state.sel && state.sel !== zoomed()) select(null);
    else up();
    return;
  }
  if (typing) { // Enter keeps only the matches, as the filter always did
    if (e.key === "Enter" && state.filter) { state.collapsed = true; rebuild(); $("#filter").blur(); render(); }
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("[role=button]")) { e.preventDefault(); e.target.click(); return; }
  if (e.key === "Enter" && e.target.matches?.("button, a, select, input, textarea")) return; // the control's own Enter
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Tab") { // the map walks its boxes; anywhere else, and past the last box, Tab is the browser's
    if (e.target === map && step(e.shiftKey ? -1 : 1)) e.preventDefault();
  }
  else if (e.key === "/") { e.preventDefault(); $("#filter").focus(); }
  else if (e.key === "Enter") state.sel ? open(state.sel) : step(1);
  else if (e.key === "Backspace") { e.preventDefault(); up(); }
  else if (e.key === "e" && DATA.export) exportJSON();
  else if (e.key === "c" || e.key === "t") { state.change = !state.change; render(); }
  else if (/^[1-5]$/.test(e.key)) setView(VIEW_KEYS[+e.key - 1]);
});

function exportJSON() {
  const blob = new Blob([JSON.stringify(DATA.export, null, 2)], { type: "application/json" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "aztree-export.json" });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#export").addEventListener("click", exportJSON);
if (!DATA.export) $("#export").style.display = "none";

const tip = $("#tip");
map.addEventListener("mousemove", e => {
  const c = e.target.closest(".cell");
  if (!c) { tip.style.display = "none"; return; }
  const n = c._n, d = n.cur - n.prev;
  const ch = n.prev < 0.01 ? "new" : `${d >= 0 ? "+" : ""}${pct(d / n.prev)} vs prev`;
  tip.innerHTML = `<div class="t1">${n.kind === "leaf" ? esc(n.parent.name) + " / " : ""}<b>${esc(n.name)}</b></div>
    <div class="t2">${money(n.cur)} · ${pct(grand ? n.cur / grand : 0)} of bill${n.kind === "leaf" && n.parent.cur > 0
      ? ` · ${pct(n.cur / n.parent.cur)} of ${esc(n.parent.name)}` : ""} · ${ch}</div>`;
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tw - 8) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - th - 8) + "px";
});
map.addEventListener("mouseleave", () => (tip.style.display = "none"));

const subs = DATA.subscriptions || [];
$("#meta").innerHTML = (DATA.demo ? `<span class="badge">demo data</span> ` : "") +
  `${esc(DATA.metric || "ActualCost")} · ${esc(subs.length === 1 ? subs[0].name : subs.length + " subscriptions")} · read ${esc(DATA.generated || "")}` +
  (DATA.source?.kind === "focus" ? ` · <span title="${esc(`${DATA.source.files} file${DATA.source.files === 1 ? "" : "s"}, ${DATA.source.first} to ${DATA.source.last}`)}">from FOCUS export files</span>` : "");
let raf;
render();
remember(false);
new ResizeObserver(() => { anim?.cancel(); cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }).observe(map);
</script>
</body>
</html>
