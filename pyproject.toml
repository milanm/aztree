[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aztree"
dynamic = ["version"]
description = "See where your Azure money goes, as a treemap in one offline HTML page."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Milan Milanović" }]
keywords = ["azure", "cost", "cost-management", "finops", "treemap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/milanm/aztree"
Issues = "https://github.com/milanm/aztree/issues"

[project.scripts]
aztree = "aztree:main"

[tool.hatch.version]
path = "aztree/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["aztree", "tests", "README.md", "LICENSE", "THIRD-PARTY-NOTICES.md"]
