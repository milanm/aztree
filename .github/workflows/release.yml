name: release
on:
  push:
    tags: ["v*"]
  # a rehearsal: builds, checks and signs everything (with SignPath's test certificate) and publishes nothing
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: The tag must match the package version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import aztree; print(aztree.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Tests must pass before anything is published (PyPI never takes a version twice)
        run: python -m unittest discover -s tests -v
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    # after every executable built: PyPI never takes a version twice, so a failed build must stop the release here.
    # A rehearsal stops here too, and so skips every job after it.
    needs: [build, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  binaries:
    # aztree frozen into one executable per platform, so nobody needs Python; each is checked before it ships
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # SignPath fetches the unsigned executable from this run
    env:
      # the Windows executable goes to SignPath once SIGNPATH_ORGANIZATION_ID is set: a rehearsal signs it with the test
      # certificate, a release with the policy SIGNPATH_SIGNING_POLICY names, and stays unsigned while that's unset
      SIGNING_POLICY: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && (github.event_name == 'workflow_dispatch' && 'test-signing' || vars.SIGNPATH_SIGNING_POLICY) || '' }}
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-22.04, rid: linux-x64 }
          - { os: ubuntu-22.04-arm, rid: linux-arm64 }
          - { os: macos-15, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "pyinstaller==6.*"
      - name: Hide the certificates this Python was built to read, as on most machines (issue #2)
        if: runner.os != 'Windows'
        run: |
          for p in $(python -c "import ssl; p = ssl.get_default_verify_paths(); print(p.openssl_cafile, p.openssl_capath)"); do
            if [ -e "$p" ]; then sudo mv "$p" "$p.hidden"; echo "hid $p"; fi
          done
      - run: python packaging/build_native.py --rid ${{ matrix.rid }}
      - name: Put the certificates back, which the runner itself needs to talk to GitHub
        if: runner.os != 'Windows'
        run: |
          for p in $(python -c "import ssl; p = ssl.get_default_verify_paths(); print(p.openssl_cafile, p.openssl_capath)"); do
            if [ -e "$p.hidden" ]; then sudo mv "$p.hidden" "$p"; fi
          done
      - name: The version SignPath checks the executable for
        id: version
        if: runner.os == 'Windows' && env.SIGNING_POLICY != ''
        shell: bash
        run: echo "version=$(python -c 'import aztree; print(aztree.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: unsigned
        if: steps.version.outcome == 'success'
        with:
          name: unsigned-${{ matrix.rid }}
          path: build-native/aztree-${{ matrix.rid }}.exe
      # .signpath/artifact-configuration.xml says what SignPath will sign; every release waits for Milan to approve it
      - uses: signpath/github-action-submit-signing-request@v3
        if: steps.version.outcome == 'success'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: aztree
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build-native/signed
      - name: The signed executable replaces the unsigned one, and still runs
        if: steps.version.outcome == 'success'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature build-native/signed/aztree-${{ matrix.rid }}.exe
          "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if (-not $sig.SignerCertificate) { throw "SignPath sent back an unsigned file" }
          # the test certificate is self-signed, so only the real one can be trusted
          if ($env:SIGNING_POLICY -ne 'test-signing' -and $sig.Status -ne 'Valid') { throw $sig.StatusMessage }
          Move-Item -Force build-native/signed/aztree-${{ matrix.rid }}.exe build-native/aztree-${{ matrix.rid }}.exe
          ./build-native/aztree-${{ matrix.rid }}.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: build-native/aztree-${{ matrix.rid }}*
  github-release:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native/
      # signed proof that this workflow built each executable from the tagged commit, which anyone can check with
      # `gh attestation verify <file> --repo milanm/aztree`: not every download is code-signed, and antivirus guesses
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: native/*
      - name: A GitHub release with the executables attached
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_SIGNING_POLICY != '' }}
        run: |
          if [ "$SIGNED" = true ]; then
            signing="The Windows executable is signed: free code signing provided by SignPath.io, certificate by SignPath Foundation ([code signing policy](https://github.com/milanm/aztree#code-signing-policy)). The macOS downloads aren't signed, so macOS asks once before running them."
          else
            signing="The downloads aren't signed yet: Windows and macOS ask once before running them, and a few antivirus engines flag the Windows executable, as they do many Python tools packed with PyInstaller."
          fi
          notes="$(git log -1 --format=%b)

          Install with \`pipx install aztree\` or \`dotnet tool install -g aztree\`, or download the executable for your system below. $signing Check that a download was built here with \`gh attestation verify <file> --repo milanm/aztree\`, or install with pipx, which runs the plain Python source."
          gh release create "$GITHUB_REF_NAME" native/* --title "aztree ${GITHUB_REF_NAME#v}" --notes "$notes"
  nuget:
    # trusted publishing: NuGet.org trusts this workflow, no API key is stored. Off until the NUGET_USER variable is set.
    needs: [publish, binaries]
    if: vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: native/
      - name: Put each executable where the launcher looks for it
        run: |
          for f in native/aztree-*; do
            rid=$(basename "$f"); rid=${rid#aztree-}; rid=${rid%.exe}
            name=aztree; case "$f" in *.exe) name=aztree.exe;; esac
            mkdir -p "dotnet/native/$rid" && cp "$f" "dotnet/native/$rid/$name"
          done
          ls -R dotnet/native
      - run: dotnet pack dotnet -c Release -p:Version=${GITHUB_REF_NAME#v} -o nupkg
      - name: The package installs and runs before it's published
        run: |
          dotnet tool install aztree --tool-path ./.tools --add-source ./nupkg --version ${GITHUB_REF_NAME#v}
          ./.tools/aztree --version
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
  winget:
    # opens the winget-pkgs pull request for each new version, from milanm's fork of winget-pkgs;
    # needs a classic token with public_repo scope in the WINGET_TOKEN secret, and skips itself without one
    needs: github-release
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: MilanMilanovic.AzTree
          installers-regex: 'aztree-win-x64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
