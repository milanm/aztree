name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: python -m aztree --demo --no-open --out demo.html
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: The wheel carries the page
        run: python -c "import zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'aztree/viewer.html' in names, names"
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/aztree --version
          AZTREE_HOME=/tmp/home /tmp/v/bin/aztree --demo --no-open
          test -s /tmp/home/aztree.html
  native:
    # the frozen executable and the dotnet tool that carries it: built, installed and run on each OS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-22.04, rid: linux-x64 }
          - { os: macos-15, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install "pyinstaller==6.*"
      - name: Freeze aztree and check the executable
        run: python packaging/build_native.py --rid ${{ matrix.rid }}
      - name: Pack the dotnet tool with it, install it, run it
        shell: bash
        run: |
          ext=""; [ "${{ matrix.rid }}" = "win-x64" ] && ext=".exe"
          mkdir -p dotnet/native/${{ matrix.rid }}
          cp build-native/aztree-${{ matrix.rid }}$ext dotnet/native/${{ matrix.rid }}/aztree$ext
          version=$(python -c "import aztree; print(aztree.__version__)")
          dotnet pack dotnet -c Release -p:Version=$version -o nupkg
          dotnet tool install aztree --tool-path ./.tools --add-source ./nupkg --version $version
          ./.tools/aztree --version
          AZTREE_HOME=./.home ./.tools/aztree --demo --no-open
          test -s ./.home/aztree.html
          if ./.tools/aztree --days 0; then echo "a bad option must fail through the tool too"; exit 1; fi
